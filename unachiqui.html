<html lang="es">
<head>
 <meta charset="UTF-8">
 <tittle>Transformación en Imagen</tittle>
 <style>
  .imagen {
   width: 200px;
   transition: transform 0.5s;
   border-radius: 10px;
   box-shadow: 0 4px 8px rgba(0,0,0,0.3);
 }

 .imagen:hover {
   transform;scale(1.2);
}
.multicolumna {
column-count: 2;
column-grap: 40px;
column-rule: 1px dotted gray;
margin-top: 40px;
}
</style>
</head>
<body bgcolor="#f5f5f5" text="#333" style="font-family: Arial; text-align:center;">

  <h2>transformación en Imagen al pasar el mouse </h2>
  <img src="https://cataas.com/cat" class="imagen" alt="laberinto">

  <h2>Texto en múltiples columnas</h2>
  <div class="multicolumna">
</div>

</body>
</html>
