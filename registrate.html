<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Consultoría de Ciberseguridad — Omega Security</title>
 
    
</head>

<body>

  <main>
    <div class="header-consultoria">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8subscriptionZ"/></svg>
      <h1>Registro de Auditoría</h1>
    </div>
    <p class="subtitulo">Ingresa los datos para dar de alta la solicitud de consultoría de ciberseguridad.</p>

      <input type="hidden" id="sistema" name="sistema" value="SAP">

      <fieldset>
        <legend>Datos Personales y Sistema</legend>

        <div class="form-group-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <div class="input-wrapper">
              <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autocomplete="given-name">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="apellido">Apellido</label>
            <div class="input-wrapper">
              <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required autocomplete="family-name">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="email">Correo Corporativo</label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" placeholder="ejemplo@empresa.com" autocomplete="email">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="edad">Edad</label>
            <div class="input-wrapper">
              <input type="number" id="edad" name="edad" min="0" max="120" inputmode="numeric" placeholder="Ej. 30">
              <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Género</legend>
        <div class="radio-group">
          <div class="radio-card">
            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label>
          </div>
          <div class="radio-card">
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label>
          </div>
          <div class="radio-card">
            <input type="radio" id="otros" name="genero" value="otros">
            <label for="otros">Otros</label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Detalles de la Consulta</legend>
        <div class="form-group">
          <label for="comentario">Comentario o Alcance del Proyecto</label>
          <textarea id="comentario" name="comentario" placeholder="Describe los sistemas o alcances que requieres auditar..."></textarea>
        </div>
      </fieldset>

      <div class="acciones">
        <button type="submit">
          Registrar Consultar
        
        <button type="reset">
          Limpiar
        </button>
      </div>
    </form>
  </main>
</body>
</html>
