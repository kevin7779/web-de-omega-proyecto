<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Omega Ciberseguridad</title>
    <link rel="stylesheet" href="css/nosotros.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 40px auto;
            background-color: #0b1724;
            border: 1px solid #1a2e40;
            padding: 30px;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            color: #a0aec0;
            font-size: 14px;
        }
        .form-group input {
            background-color: #060d14;
            border: 1px solid #1a2e40;
            padding: 12px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #00c8ff;
        }
        .btn-submit {
            width: 100%;
            background-color: #0099ff;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #0080ff;
        }
    </style>
</head>
<body>

    <!-- Encabezado / Menú -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-shield-halved"></i> OMEGA CIBERSEGURIDAD
            </a>
            <nav>
                <ul>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="metodo.html">Cómo trabajamos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                   <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
                    <li><a href="registrate.html" class="btn-registrate">Regístrate</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="nosotros-container">
        <div class="login-box">
            <h2 style="margin-top:0; color:#fff; text-align:center;">Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="usuario@empresa.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </main>

    <!-- Pie de página -->
    <footer>
        <div class="footer-container">
            <span>© 2026 Omega Ciberseguridad</span>
            <span>Pruebas siempre con autorización por escrito del cliente.</span>
        </div>
    </footer>

    <!-- Script para redirigir al hacer login -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que se recargue la página vacía
            alert('¡Inicio de sesión exitoso!');
            window.location.href = 'index.html'; // Redirige al inicio
        });
    </script>

</body>
</html>
