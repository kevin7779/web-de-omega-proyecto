<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar Sesión - Omega Ciberseguridad</title>

  <link rel="stylesheet" href="css/nosotros.css?v=2">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    .login-box {

      max-width: 400px;

      margin: 40px auto;

      background-color: #0b1724;

      border: 1px solid #1a2e40;

      padding: 30px;

      border-radius: 10px;

    }

    .form-group {

      margin-bottom: 20px;

      display: flex;

      flex-direction: column;

      gap: 8px;

    }

    .form-group label {

      color: #a0aec0;

      font-size: 14px;

    }

    .form-group input {

      background-color: #060d14;

      border: 1px solid #1a2e40;

      padding: 12px;

      border-radius: 6px;

      color: #ffffff;

      font-size: 14px;

      outline: none;

      width: 100%;

      box-sizing: border-box;

    }

    .form-group input:focus {

      border-color: #00c8ff;

    }

     

    /* Contenedor y estilos para el campo de contraseña con el botón de ver */

    .input-wrapper {

      position: relative;

      display: flex;

      align-items: center;

    }

    .input-wrapper input {

      padding-right: 40px;

    }

    .toggle-password {

      position: absolute;

      right: 12px;

      background: none;

      border: none;

      color: #718096;

      cursor: pointer;

      font-size: 14px;

      padding: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: color 0.2s;

    }

    .toggle-password:hover {

      color: #00c8ff;

    }



    .btn-submit {

      width: 100%;

      background-color: #0099ff;

      color: #ffffff;

      border: none;

      padding: 12px;

      border-radius: 6px;

      font-weight: 600;

      cursor: pointer;

      transition: background 0.2s;

    }

    .btn-submit:hover {

      background-color: #0080ff;

    }

    .btn-submit:disabled {

      opacity: 0.6;

      cursor: wait;

    }

    #estado {

      margin: 12px 0 0 0;

      font-size: 13px;

      text-align: center;

    }

    #estado:empty { display: none; }

    #estado.ok { color: #48d597; }

    #estado.error { color: #ff7b72; }

    .btn-login.active {

      color: #ffffff;

      font-weight: 700;

      border-bottom: 2px solid #00c8ff;

      padding-bottom: 4px;

    }

  </style>

</head>

<body>



  <!-- Encabezado / Menú -->

  <header>

    <div class="header-container">

      <a href="index.html" class="logo">

        <i class="fa-solid fa-shield-halved"></i> OMEGA CIBERSEGURIDAD

      </a>

      <nav>

        <ul>

          <li><a href="servicios.html">Servicios</a></li>

          <li><a href="metodo.html">Cómo trabajamos</a></li>

          <li><a href="nosotros.html">Nosotros</a></li>

          <li><a href="contacto.html">Contacto</a></li>

          <li><a href="login.html" class="btn-login active">Iniciar sesión</a></li>

          <li><a href="registrate.html" class="btn-registrate">Regístrate</a></li>

        </ul>

      </nav>

    </div>

  </header>



  <!-- Contenido Principal -->

  <main class="nosotros-container">

    <div class="login-box">

      <h2 style="margin-top:0; color:#fff; text-align:center;">Iniciar Sesión</h2>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">Correo Electrónico</label>

          <input type="email" id="email" placeholder="usuario@empresa.com" required maxlength="150" autocomplete="email">

        </div>

        <div class="form-group">

          <label for="password">Contraseña</label>

          <div class="input-wrapper">

            <input type="password" id="password" placeholder="••••••••" required maxlength="72" autocomplete="current-password">

            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eye-password')">

              <i class="fa-solid fa-eye" id="eye-password"></i>

            </button>

          </div>

        </div>

        <button type="submit" id="btn-ingresar" class="btn-submit">Ingresar</button>

        <p id="estado" role="status" aria-live="polite"></p>

      </form>

    </div>

  </main>



  <!-- Pie de página -->

  <footer>

    <div class="footer-container">

      <span>© 2026 Omega Ciberseguridad</span>

      <span>Pruebas siempre con autorización por escrito del cliente.</span>

    </div>

  </footer>



  <!-- Script de JavaScript para alternar la visibilidad de la contraseña -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/login.js">

  </script>



</body>

</html>
