  <style>
    header {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

    }
    body { padding-top: 70px !important; height: auto !important; min-height: 100vh; overflow-x: hidden; }

    /* Arreglo: el pie de página queda al final del contenido, no flotando encima */

      top: auto !important;
      bottom: auto !important;
      left: auto !important;

      z-index: 1 !important;

      position: relative !important;
      width: 100% !important;
      max-width: none !important;
      height: auto !important;

      background: #07111b !important;
      padding: 40px 20px 70px !important;
